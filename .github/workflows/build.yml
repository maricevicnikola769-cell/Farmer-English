name: Make EXE

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: |
          python -m pip install pytest
          python -m pytest -q testovi

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Make EXE
        run: pyinstaller --onefile --windowed --name FarmerEnglish --icon farmer.ico --add-data "farmer.ico;." Farmer_English.pyw

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=2.${{ github.run_number }}" farmer-setup.iss

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: Farmer English 2.${{ github.run_number }}
          files: |
            dist/FarmerEnglish-Setup.exe
            dist/FarmerEnglish.exe
